{% extends "base.html" %}
{% block content %}
<body class="feedback-page">
<h2>Give Feedback</h2>

<form method="post" action="{% if feedback %}{{ url_for('feedback_edit', fb_id=feedback._id) }}{% else %}{{ url_for('feedback') }}{% endif %}" enctype="multipart/form-data">
  <div class="form-group">
    <label class="form-label">Your name</label>
    <input class="form-control" name="name" value="{{ feedback.name if feedback else '' }}" required>
  </div>
  <div class="form-group">
    <label class="form-label">Your email</label>
    <input class="form-control" name="email" value="{{ feedback.email if feedback else '' }}" {% if feedback %}readonly{% endif %} required>
  </div>
  <div class="form-group">
    <label class="form-label">Rating (0-10)</label>
    <input class="form-control" name="rating" type="number" min="0" max="10" value="{{feedback.rating if feedback else ''}}" required>
  </div>
  <div class="form-group">
    <label class="form-label">Comments</label>
    <textarea class="form-control" name="comments" rows="3">{{ feedback.comments if feedback else '' }}</textarea>
  </div>
  <!-- 📸 New photo upload option -->
  <div class="form-group">
    <label for="form-label">Upload Your Happy Moments To Be Featured In Our Gallery Collections (optional)</label><br>
    <input type="file" class="form-control" id="photo" name="photos" accept="image/*" multiple>
  </div><br>
  <div class="form-group">
    <center><button class="btn btn-success" type="submit">{{ "Update Feedback" if feedback else "Submit Feedback" }}</button></center>
  </div>
</form>

</body>
{% endblock %}
