{% extends "base.html" %}
{% block content %}
<body class="booking-page">
<h2>{% if booking %}Edit Booking{% else %}Book a Room{% endif %}</h2>
<form method="post" action="{% if booking %} {{ url_for('booking_edit') }} {% else %}{{ url_for('booking') }}">
  <div class="mb-3">
    <label class="form-label">Full name</label>
    <input class="form-control" name="name" value ="{{ booking.name if booking else ''}}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Phone</label>
    <input class="form-control" name="phone" value ="{{ booking.label if booking else ''}}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input class="form-control" name="email" value ="{{ booking.email if booking else ''}} type="email">
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Check-in</label>
      <input class="form-control" name="check_in" type="date" value="{{ booking.check_in if booking else '' }}"required>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Check-out</label>
      <input class="form-control" name="check_out" type="date" value="{{ booking.check_out if booking else '' }}"required>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Guests</label>
    <input class="form-control" name="guests" type="number" min="1" value="{{ booking.guests if booking else '1'}}" required>
  </div>
  {% if booking and current_user.is_authenticated %}
    <!-- Status field only visible to admins when editing -->
    <div class="mb-3">
      <label for="status">Status</label>
      <select name="status" class="form-select">
        <option value="pending" {% if booking.status == "Pending" %}selected{% endif %}>Pending</option>
        <option value="accepted" {% if booking.status == "Accepted" %}selected{% endif %}>Accepted</option>
        <option value="rejected" {% if booking.status == "Rejected" %}selected{% endif %}>Rejected</option>
      </select>
    </div>
    {% endif %}
  <div class="mb-3">
    <label class="form-label">Note</label>
    <textarea class="form-control" name="note" rows="3">{{ booking.note if booking else ''}}</textarea>
  </div>
  <div class="mb-3">
    <small class="text-muted"><b>AC facility not available.</b></small>
  </div>
  <button class="btn btn-success" type="submit">{{ "Update Booking" if booking else "Submit Booking" }}</button>
</form>
{% endblock %}
